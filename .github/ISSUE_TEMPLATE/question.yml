name: 提问 / 讨论
description: 使用上的疑问、配置求助、想法讨论
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        提问前建议先看 README 的「快速开始 / 接入 QQ / 常见问题」三节，多数问题那里有答案。
        ⚠️ 不要粘贴真实 API Key、AppSecret 或 openid。
  - type: textarea
    id: question
    attributes:
      label: 你的问题
      description: 说清楚你想做什么、卡在哪一步、看到什么提示
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: 你已经试过什么
      description: 例如：换过服务商地址、点过「测试连接」、看过日志里的哪一行
    validations:
      required: false
